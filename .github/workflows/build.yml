name: Build runner image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=sha
          labels: |
            org.opencontainers.image.title=GitHub Actions ARC runner
            org.opencontainers.image.description=Minimal ARC runner image using the ICSCoE Ubuntu mirror

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "${image}"
          docker run --rm "${image}" bash -euc '
            test "$(id -u)" = "1001"
            test "$(id -g)" = "1001"
            test -x /home/runner/run.sh
            dpkg-query -W -f="${Status}\n" libatomic1 | grep -F "install ok installed"
            /sbin/ldconfig -p | grep -F "libatomic.so.1"
            grep -R -F "https://ftp.udx.icscoe.jp/Linux/ubuntu" /etc/apt
          '
